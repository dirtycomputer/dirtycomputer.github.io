<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15171d"><title>饮食与营养</title><style>:root{--bg:#15171d;--panel:#242731;--panel2:#2c303b;--text:#f6f7fb;--muted:#9ca4b4;--line:rgba(255,255,255,.08);--green:#69da7a;--green2:#45bc63;--teal:#4fd2cf;--blue:#62b8ff;--orange:#ff9b63;--yellow:#f3ca63;--red:#ff7272}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(900px 520px at 50% -10%,#303441 0,#1a1c23 46%,var(--bg) 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}body{min-height:100vh;padding:18px 14px calc(34px + env(safe-area-inset-bottom))}.app{max-width:470px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:15px;font-weight:750}.status{font-size:12px;color:var(--muted);padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line)}.status.ok{color:var(--green)}.status.err{color:var(--yellow)}.monthbar{display:flex;align-items:center;gap:12px;margin:22px 0 14px}.monthbar button{width:42px;height:42px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;border-radius:14px;font-size:25px}.ym{flex:1}.ym small{display:block;color:var(--muted);font-size:16px;margin-bottom:4px}.ym strong{font-size:44px;letter-spacing:-.04em}.tabs{display:flex;justify-content:center;margin:0 0 18px}.seg{display:flex;background:rgba(255,255,255,.07);border-radius:18px;padding:4px}.seg button{border:0;background:transparent;color:var(--muted);padding:11px 28px;border-radius:15px;font-size:17px;font-weight:800}.seg button.on{background:#f3f4f7;color:#14151a}.section{margin-top:18px}.title{font-size:20px;font-weight:850;margin-bottom:5px}.sub{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.035));border-radius:24px;box-shadow:0 18px 44px rgba(0,0,0,.25)}.cal{padding:14px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.week{font-size:13px;font-weight:750;text-align:center;color:#e7e9ef;margin-bottom:7px}.day{position:relative;min-height:84px;border-radius:16px;border:1px solid rgba(255,255,255,.035);background:rgba(255,255,255,.018);padding:8px 6px;overflow:hidden}.day.out{opacity:.27}.day.sel{outline:2px solid var(--green);background:rgba(105,218,122,.08)}.dn{font-size:14px;font-weight:800}.kc{position:absolute;left:6px;right:6px;bottom:25px;padding:4px 3px;border-radius:8px;background:linear-gradient(180deg,var(--green),var(--green2));color:#07120a;font-size:11px;text-align:center;font-weight:900}.mc{position:absolute;left:6px;right:6px;bottom:6px;text-align:center;font-size:10px;color:#c8cdd8;background:rgba(255,255,255,.05);border-radius:7px;padding:2px}.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.chip{padding:11px 6px;text-align:center;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}.chip small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.chip b{font-size:16px}.daycard{padding:16px}.dayhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.dayhead h2{font-size:25px;margin:0}.dayhead p{margin:5px 0 0;color:var(--muted);font-size:12px}.big{font-size:34px;font-weight:900;white-space:nowrap}.big small{font-size:11px;color:var(--muted);font-weight:700}.meals{display:grid;gap:10px;margin-top:14px}.meal{padding:13px;border-radius:17px;background:rgba(255,255,255,.035);border:1px solid var(--line)}.mt{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{font-size:11px;font-weight:900;color:#0a0c10;border-radius:999px;padding:5px 10px;background:var(--green)}.tag.晚餐{background:var(--blue)}.tag.加餐{background:var(--orange)}.tag.早餐{background:var(--yellow)}.meal h3{font-size:15px;margin:8px 0 5px}.detail{font-size:12px;line-height:1.5;color:var(--muted)}.macros{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.m{font-size:10px;color:#dde1e8;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.045);padding:5px 7px;border-radius:999px}.view{display:none}.view.on{display:block}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi{padding:15px;min-height:105px}.kpi small{color:var(--muted)}.kpi b{display:block;font-size:31px;margin-top:12px;letter-spacing:-.04em}.kpi em{font-style:normal;color:var(--green);font-size:11px}.pyramid{padding:18px 14px}.pwrap{display:flex;flex-direction:column-reverse;align-items:center;gap:8px}.tier{position:relative;min-height:70px;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border:1px solid rgba(79,210,207,.16);background:rgba(79,210,207,.07);clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);overflow:hidden}.tier:before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p);background:linear-gradient(90deg,rgba(105,218,122,.5),rgba(79,210,207,.3))}.tier>*{position:relative;z-index:1}.tier .t{font-size:14px;font-weight:850}.tier .d{font-size:10px;color:#cad0da;margin-top:4px}.tier .n{text-align:right;font-weight:900;font-size:20px}.tier .n small{display:block;font-size:9px;color:#cad0da;margin-top:4px}.t1{width:100%}.t2{width:84%}.t3{width:68%}.t4{width:52%}.trend{padding:16px}.bars{height:210px;display:flex;gap:7px;align-items:flex-end;margin-top:10px}.col{flex:1;min-width:0;text-align:center}.track{height:155px;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.04);display:flex;align-items:flex-end;padding:5px}.bar{width:100%;border-radius:8px;background:linear-gradient(180deg,var(--green),var(--teal));min-height:4px}.bv{font-size:10px;font-weight:800;margin-top:5px}.bl{font-size:9px;color:var(--muted);margin-top:2px}.foot{margin-top:15px;padding:13px 14px;font-size:11px;color:var(--muted);line-height:1.5}.foot button{float:right;border:0;background:rgba(255,255,255,.07);color:#fff;border-radius:10px;padding:7px 10px;font-weight:800}@media(max-width:360px){.ym strong{font-size:38px}.day{min-height:76px}.chips{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="app"><div class="top"><div class="brand">🥗 饮食与营养</div><div id="sync" class="status">准备同步</div></div><div class="monthbar"><button id="prev">‹</button><div class="ym"><small id="year">2026</small><strong id="month">8月</strong></div><button id="next">›</button></div><div class="tabs"><div class="seg"><button class="on" data-v="history">历史</button><button data-v="stats">统计</button></div></div><section id="history" class="view on"><div class="section"><div class="title">每日摄入日历</div><div class="sub">每一天直接显示总热量。点击日期查看当日餐次和营养构成。</div><div class="card cal"><div class="week"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div><div id="grid" class="grid"></div><div id="monthStats" class="chips"></div></div></div><div class="section"><div class="card daycard"><div class="dayhead"><div><h2 id="dateTitle">—</h2><p id="dateSub">请选择日期</p></div><div id="kcal" class="big">0 <small>kcal</small></div></div><div id="dayMacros" class="chips"></div><div id="meals" class="meals"></div></div></div></section><section id="stats" class="view"><div class="section"><div class="title">营养概况</div><div class="sub">以最近一个有记录日期为默认视图；点击日历中的日期后这里会同步切换。</div><div id="kpis" class="kpis"></div></div><div class="section"><div class="title">膳食指南金字塔</div><div class="sub">以膳食宝塔的层级逻辑映射到当前可记录的营养指标：主食/碳水、蔬果/纤维、蛋白质来源、油脂。</div><div class="card pyramid"><div id="pyramid" class="pwrap"></div></div></div><div class="section"><div class="card trend"><div class="title" style="font-size:18px">最近 7 日热量趋势</div><div id="bars" class="bars"></div></div></div></section><div class="card foot"><button id="refresh">刷新</button><div id="hint">正在读取 Google Sheet…</div></div></main><script>const ID='1ZLj2A9Nyd2PN_caHuMhPJk1oG0OdT_LXVbPU8K4wKks',targets={kcal:1800,protein:90,carbs:230,fat:60,fiber:25},fallback=[{date:'2026-08-19',type:'晚餐',food:'番茄锅火锅：牛肉、鱼片、鹌鹑蛋、蔬菜',detail:'牛肉约90–110g；鱼片约70–90g；鹌鹑蛋2颗；蔬菜；番茄锅；辣椒面+醋',kcal:430,protein:42,carbs:18,fat:20,fiber:5},{date:'2026-08-21',time:'14:02',type:'午餐',food:'虾三鲜水饺 + 白灼生菜 + 酱油蒜蓉',detail:'水饺12只；白灼生菜1份；酱油约1汤匙；蒜蓉约10g',kcal:620,protein:33,carbs:68,fat:22,fiber:4},{date:'2026-08-21',type:'晚餐',food:'麦当劳“苹板”支撑Pro套餐',detail:'板烧鸡腿堡；小杯玉米杯；苹果片60g；无糖可口可乐',kcal:500,protein:25,carbs:62,fat:17,fiber:6},{date:'2026-08-21',type:'加餐',food:'桃子 2个',detail:'中等大小估算',kcal:120,protein:2,carbs:30,fat:.6,fiber:4}];let meals=[],agg={},sel='',Y=2026,M=7;const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);function n(v){let x=Number(String(v??'').replace(/,/g,''));return Number.isFinite(x)?x:0}function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function pretty(s){let d=new Date(s+'T00:00:00');return `${d.getMonth()+1}月${d.getDate()}日`}function wd(s){return ['周日','周一','周二','周三','周四','周五','周六'][new Date(s+'T00:00:00').getDay()]}function parseDate(v){let s=String(v||'');let m=s.match(/Date\((\d+),(\d+),(\d+)\)/);if(m)return `${m[1]}-${String(+m[2]+1).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;let d=s.match(/(\d{4})[-\/]?(\d{1,2})[-\/]?(\d{1,2})/);return d?`${d[1]}-${String(d[2]).padStart(2,'0')}-${String(d[3]).padStart(2,'0')}`:''}function gv(text){let a=text.indexOf('{'),b=text.lastIndexOf('}');return JSON.parse(text.slice(a,b+1))}async function sheet(name){let u=`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?sheet=${encodeURIComponent(name)}&tqx=out:json&headers=1`;let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(r.status);let j=gv(await r.text()),h=j.table.cols.map(c=>c.label||'');return(j.table.rows||[]).map(row=>Object.fromEntries(h.map((k,i)=>{let c=row.c?.[i];return[k,c?(c.f??c.v??''): '']})))}function norm(rows){return rows.map(r=>({date:parseDate(r['日期']),time:String(r['时间']||''),type:String(r['餐次']||'未分类'),food:String(r['食物 / 菜品']||''),detail:String(r['份量与主要成分']||''),kcal:n(r['热量 (kcal)']),protein:n(r['蛋白质 (g)']),carbs:n(r['碳水 (g)']),fat:n(r['脂肪 (g)']),fiber:n(r['膳食纤维 (g)'])})).filter(x=>x.date)}function build(){agg={};for(let x of meals){let a=agg[x.date]??={date:x.date,kcal:0,protein:0,carbs:0,fat:0,fiber:0,meals:[]};for(let k of['kcal','protein','carbs','fat','fiber'])a[k]+=x[k];a.meals.push(x)}}function latest(){return Object.keys(agg).sort().at(-1)||''}function setSel(s){sel=s;if(s){let d=new Date(s+'T00:00:00');Y=d.getFullYear();M=d.getMonth()}render()}function pct(v,t){return Math.max(0,Math.min(100,Math.round(v/t*100)||0))}function calendar(){year.textContent=Y;month.textContent=(M+1)+'月';grid.innerHTML='';let f=new Date(Y,M,1),start=(f.getDay()+6)%7,days=new Date(Y,M+1,0).getDate(),prevDays=new Date(Y,M,0).getDate(),cells=[];for(let i=0;i<start;i++)cells.push(new Date(Y,M-1,prevDays-start+i+1));for(let d=1;d<=days;d++)cells.push(new Date(Y,M,d));while(cells.length%7||cells.length<35)cells.push(new Date(Y,M+1,cells.length-start-days+1));for(let d of cells){let s=iso(d),inside=d.getMonth()===M,a=agg[s],e=document.createElement('button');e.className='day'+(inside?'':' out')+(s===sel?' sel':'');e.style.color='inherit';e.style.font='inherit';e.innerHTML=`<div class=dn>${d.getDate()}</div>${a?`<div class=kc>${Math.round(a.kcal)} kcal</div><div class=mc>${a.meals.length} 餐</div>`:''}`;e.onclick=()=>setSel(s);grid.appendChild(e)}let list=Object.values(agg).filter(a=>{let d=new Date(a.date+'T00:00:00');return d.getFullYear()===Y&&d.getMonth()===M}),tot=list.reduce((s,a)=>s+a.kcal,0),count=list.reduce((s,a)=>s+a.meals.length,0);monthStats.innerHTML=[['记录日',list.length],['总摄入',Math.round(tot)],['日均',list.length?Math.round(tot/list.length):0],['餐次',count]].map(x=>`<div class=chip><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}function day(){let a=agg[sel];if(!a){dateTitle.textContent='暂无记录';dateSub.textContent='该日期尚未记录饮食';kcal.innerHTML='0 <small>kcal</small>';dayMacros.innerHTML='';meals.innerHTML='<div class=meal><div class=detail>请选择有记录的日期。</div></div>';return}dateTitle.textContent=pretty(sel);dateSub.textContent=`${wd(sel)} · ${a.meals.length} 餐`;kcal.innerHTML=`${Math.round(a.kcal)} <small>kcal</small>`;dayMacros.innerHTML=[['蛋白质',Math.round(a.protein)+'g'],['碳水',Math.round(a.carbs)+'g'],['脂肪',Math.round(a.fat*10)/10+'g'],['纤维',Math.round(a.fiber*10)/10+'g']].map(x=>`<div class=chip><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');meals.innerHTML=a.meals.map(x=>`<div class=meal><div class=mt><span class="tag ${x.type}">${x.type}</span><b>${Math.round(x.kcal)} kcal</b></div><h3>${x.food}</h3><div class=detail>${x.detail}</div><div class=macros><span class=m>蛋白质 ${Math.round(x.protein)}g</span><span class=m>碳水 ${Math.round(x.carbs)}g</span><span class=m>脂肪 ${Math.round(x.fat*10)/10}g</span><span class=m>纤维 ${Math.round(x.fiber*10)/10}g</span></div></div>`).join('')}function stats(){let a=agg[sel]||agg[latest()];if(!a)return;kpis.innerHTML=[['总摄入',Math.round(a.kcal),'kcal',pct(a.kcal,targets.kcal)],['蛋白质',Math.round(a.protein),'g',pct(a.protein,targets.protein)],['碳水',Math.round(a.carbs),'g',pct(a.carbs,targets.carbs)],['脂肪 / 纤维',`${Math.round(a.fat)} / ${Math.round(a.fiber)}`,'g','—']].map(x=>`<div class="card kpi"><small>${x[0]}</small><b>${x[1]} <span style="font-size:12px;color:var(--muted)">${x[2]}</span></b><em>${x[3]==='—'?'脂肪与纤维':x[3]+'% 目标'}</em></div>`).join('');let L=[['谷薯与主食','碳水',a.carbs,targets.carbs,'t1'],['蔬菜与水果','膳食纤维',a.fiber,targets.fiber,'t2'],['鱼禽蛋奶豆','蛋白质',a.protein,targets.protein,'t3'],['油脂','脂肪',a.fat,targets.fat,'t4']];pyramid.innerHTML=L.map(x=>`<div class="tier ${x[4]}" style="--p:${pct(x[2],x[3])}%"><div><div class=t>${x[0]}</div><div class=d>${x[1]} · 目标 ${x[3]}g</div></div><div class=n>${Math.round(x[2]*10)/10}g<small>${pct(x[2],x[3])}% 达成</small></div></div>`).join('');let end=new Date((sel||latest())+'T00:00:00'),arr=[];for(let i=6;i>=0;i--){let d=new Date(end);d.setDate(end.getDate()-i);let s=iso(d),v=agg[s]?.kcal||0;arr.push([`${d.getMonth()+1}/${d.getDate()}`,v])}let mx=Math.max(1,...arr.map(x=>x[1]));bars.innerHTML=arr.map(x=>`<div class=col><div class=track><div class=bar style="height:${Math.max(3,x[1]/mx*100)}%"></div></div><div class=bv>${Math.round(x[1])}</div><div class=bl>${x[0]}</div></div>`).join('')}function render(){calendar();day();stats()}async function load(){sync.textContent='同步中…';sync.className='status';hint.textContent='正在读取 Google Sheet 的“饮食记录”';try{let r=await sheet('饮食记录');meals=norm(r);if(!meals.length)throw Error('empty');sync.textContent='Google Sheet 已同步';sync.className='status ok';hint.textContent='数据为实时读取；刷新页面或点击“刷新”即可获取最新记录。'}catch(e){meals=fallback;sync.textContent='使用本地快照';sync.className='status err';hint.textContent='网站已可用，但 Google Sheet 尚未开放网页读取；当前展示最近一次同步快照。'}build();if(!sel)sel=latest();if(sel){let d=new Date(sel+'T00:00:00');Y=d.getFullYear();M=d.getMonth()}render()}prev.onclick=()=>{M--;if(M<0){M=11;Y--}calendar()};next.onclick=()=>{M++;if(M>11){M=0;Y++}calendar()};refresh.onclick=load;$$('.seg button').forEach(b=>b.onclick=()=>{$$('.seg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$$('.view').forEach(x=>x.classList.remove('on'));$('#'+b.dataset.v).classList.add('on')});load();setInterval(load,300000);</script></body></html>
