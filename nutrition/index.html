<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15171d"><title>饮食与营养</title><link rel="stylesheet" href="./style-v4.css?v=4"></head><body><main class="app"><div class="row"><div class="brand">🥗 饮食与营养</div><div id="sync" class="sync">准备同步</div></div><div class="row monthbar"><button id="prev" type="button">‹</button><div class="ym"><small id="year"></small><strong id="month"></strong></div><button id="next" type="button">›</button></div><div class="tabs"><div class="seg"><button class="on" data-v="history" type="button">历史</button><button data-v="stats" type="button">统计</button></div></div><section id="history" class="view on"><div class="sec"><div class="title">每日摄入日历</div><div class="sub">每一天显示总热量与四个餐次状态。点击任意日期，查看当天每一餐以及各营养素“建议摄入 / 实际摄入”的进度。</div><div class="card cal"><div class="week"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div><div id="grid" class="grid"></div><div id="monthStats" class="chips"></div></div></div><div id="dayPanel" class="sec"><div class="card daycard"><div class="row dayhead"><div><h2 id="dateTitle">—</h2><p id="dateSub"></p></div><div id="kcal" class="big"></div></div><div class="ringrow"><div id="ring" class="ring"><div class="ringin"><b id="ringPct">0%</b><small>每日热量</small></div></div><div class="goal"><h3 id="goalHead"></h3><p id="goalText"></p><span id="goalBadge" class="badge"></span></div></div><div id="dayMacros" class="chips"></div><div class="progressCard"><div class="progressTitle"><h3>每日营养进度</h3><span>实际 / 建议</span></div><div id="nutrientProgress" class="nutrientProgress"></div><div id="targetNote" class="targetNote"></div></div><div id="mealSlots" class="mealSlots"></div></div></div></section><section id="stats" class="view"><div class="sec"><div class="row statHead"><div><div class="title">统计</div><div class="sub" style="margin:0">周 / 月摄入趋势与营养状态</div></div><div id="streak" class="streak"></div></div><div class="ranges" style="width:max-content;margin-top:12px"><button class="on" data-r="week" type="button">周</button><button data-r="month" type="button">月</button></div><div id="rangeStats" class="rangeStats"></div></div><div class="sec"><div class="title">营养状态</div><div id="kpis" class="kpis"></div><div id="warns" class="warns"></div></div><div class="sec"><div class="title">膳食指南金字塔</div><div class="card pyramid"><div id="pyramid" class="pwrap"></div></div></div><div class="sec"><div class="title">食物类别分布</div><div class="card cats"><div id="catlist" class="catlist"></div></div></div><div class="sec"><div class="title">热量趋势</div><div id="trendSub" class="sub"></div><div class="card trend"><div class="barwrap"><div id="bars" class="bars"></div></div></div></div></section><div class="card foot"><button id="refresh" type="button">刷新</button><div id="hint">正在读取 Google Sheet…</div></div></main><script src="./app-v4.js?v=4"></script></body></html>
